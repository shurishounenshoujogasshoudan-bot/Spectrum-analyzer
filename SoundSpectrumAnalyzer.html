<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>統合版・ピアノ音響＆歌声アナライザー (時間軸調整対応版)</title>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #0a0a0c;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      touch-action: manipulation;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      box-sizing: border-box;
    }

    body.is-fullscreen #topNav,
    body.is-fullscreen .control-panel {
      display: none !important;
    }

    #topNav {
      background: #16161a;
      border-bottom: 1px solid #2a2a32;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
      z-index: 20;
    }

    .nav-tabs {
      display: flex;
      gap: 8px;
    }

    .tab-btn {
      padding: 8px 16px;
      font-size: 13px;
      font-weight: bold;
      background: #25252e;
      color: #aaa;
      border: 1px solid #3e3e4a;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
    }

    .tab-btn.active {
      background: #0088ff;
      color: #fff;
      border-color: #00aaff;
      box-shadow: 0 0 10px rgba(0, 136, 255, 0.4);
    }

    .control-panel {
      background: #121215;
      border-bottom: 1px solid #22222a;
      padding: 8px 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 10;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    button.action-btn {
      padding: 7px 13px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      background: #2b2b36;
      color: #eee;
      border: 1px solid #444454;
      border-radius: 5px;
      transition: 0.15s;
    }
    button.action-btn:active { background: #3b3b4a; }
    button.action-btn.primary { background: #0088ff; border-color: #00aaff; color: #fff; }
    button.action-btn.danger { background: #d32f2f; border-color: #f44336; color: #fff; }
    button.action-btn.active { background: #ff9800; border-color: #ffb74d; color: #000; }

    .slider-group {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #ccc;
    }
    input[type=range] { vertical-align: middle; cursor: pointer; }

    #infoStatus {
      font-size: 13px;
      font-weight: bold;
      color: #00e5ff;
      text-shadow: 0 0 6px rgba(0,229,255,0.3);
      white-space: nowrap;
    }

    .f3-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      background: #ffd700;
      color: #000;
      font-weight: bold;
      font-size: 11px;
      margin-left: 8px;
      box-shadow: 0 0 8px #ffd700;
      display: none;
    }

    #exitFullscreenBtn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 100;
      background: rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.4);
      color: #fff;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      display: none;
      cursor: pointer;
    }
    body.is-fullscreen #exitFullscreenBtn { display: block; }

    .main-view {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    .view-mode {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      display: none;
    }
    .view-mode.active { display: block; }

    #rtCanvas { width: 100%; height: 100%; display: block; }

    .spectrogram-wrapper {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
      touch-action: pan-y;
    }
    #specCanvas { display: block; margin: 0 auto; touch-action: none; }

    audio { display: none; }
  </style>
</head>
<body>

  <div id="topNav">
    <div class="nav-tabs">
      <button class="tab-btn active" id="tabRealtimeBtn">🎤 マイク・リアルタイム解析</button>
      <button class="tab-btn" id="tabSpectrogramBtn">📜 録音・ファイル解析 (縦スクロール)</button>
    </div>
    <div id="infoStatus">マイク待機中... <span id="f3Badge" class="f3-badge">★ F3 響き検出！</span></div>
  </div>

  <div class="control-panel" id="panelRealtime">
    <div class="control-group">
      <button class="action-btn primary" id="startMicBtn">マイク開始</button>
      <button class="action-btn" id="freezeBtn">静止 (FREEZE)</button>
      <button class="action-btn" id="resetPeakBtn">ピークリセット</button>
      <button class="action-btn danger" id="recordOneTapBtn">🔴 ワンタップ録音 (5秒)</button>
      <div class="slider-group">
        <label for="minDbSlider">感度:</label>
        <input type="range" id="minDbSlider" min="-100" max="-40" value="-80" step="5">
        <span id="minDbVal">-80 dB</span>
      </div>
    </div>
    <button class="action-btn" id="fullscreenBtn1">画面最大化</button>
  </div>

  <div class="control-panel" id="panelSpectrogram" style="display: none;">
    <div class="control-group">
      <input type="file" id="fileInput" accept="audio/*" style="font-size:12px; color:#aaa;">
      <button class="action-btn primary" id="playAudioBtn">再生</button>
      <div class="slider-group">
        <label for="timeScaleSlider">時間軸 (縦伸び):</label>
        <input type="range" id="timeScaleSlider" min="20" max="300" step="10" value="100">
        <span id="timeScaleVal">100 px/s</span>
      </div>
      <div class="slider-group">
        <label for="sensSlider">明るさ:</label>
        <input type="range" id="sensSlider" min="0.5" max="10" step="0.5" value="2.0">
        <span id="sensVal">2.0x</span>
      </div>
      <div class="slider-group">
        <label for="rateSelect">速度:</label>
        <select id="rateSelect" style="background:#222; color:#fff; border:1px solid #444; padding:3px 6px; border-radius:4px;">
          <option value="1.00" selected>1.00x</option>
          <option value="0.80">0.80x</option>
          <option value="0.60">0.60x</option>
        </select>
      </div>
    </div>
    <button class="action-btn" id="fullscreenBtn2">画面最大化</button>
  </div>

  <button id="exitFullscreenBtn">通常表示に戻す</button>

  <div class="main-view">
    <div class="view-mode active" id="viewRealtime">
      <canvas id="rtCanvas"></canvas>
    </div>

    <div class="view-mode" id="viewSpectrogram">
      <div class="spectrogram-wrapper" id="specWrapper">
        <canvas id="specCanvas"></canvas>
      </div>
    </div>
  </div>

  <audio id="audioPlayer"></audio>

  <script>
    const NUM_KEYS = 88;
    const MIN_MIDI = 21;
    const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
    const isBlackKeyList = [false, true, false, true, false, false, true, false, true, false, true, false];

    function midiToFreq(midi) {
      return 440 * Math.pow(2, (midi - 69) / 12);
    }

    const keyLUT = [];
    for (let i = 0; i < NUM_KEYS; i++) {
      const midi = MIN_MIDI + i;
      const noteIndex = midi % 12;
      const freqCenter = Math.round(midiToFreq(midi));
      const freqLow = midiToFreq(midi - 0.5);
      const freqHigh = midiToFreq(midi + 0.5);

      let region = "";
      if (midi >= 60 && midi < 72) region = "F1";
      else if (midi >= 72 && midi < 96) region = "F2";
      else if (midi >= 96 && midi <= 104) region = "F3";

      keyLUT.push({
        midi: midi,
        noteName: noteNames[noteIndex],
        octave: Math.floor(midi / 12) - 1,
        isBlack: isBlackKeyList[noteIndex],
        freqCenter: freqCenter,
        freqLow: freqLow,
        freqHigh: freqHigh,
        region: region,
        hue: (i / NUM_KEYS) * 320
      });
    }

    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    const tabRealtimeBtn = document.getElementById('tabRealtimeBtn');
    const tabSpectrogramBtn = document.getElementById('tabSpectrogramBtn');
    const viewRealtime = document.getElementById('viewRealtime');
    const viewSpectrogram = document.getElementById('viewSpectrogram');
    const panelRealtime = document.getElementById('panelRealtime');
    const panelSpectrogram = document.getElementById('panelSpectrogram');
    const infoStatus = document.getElementById('infoStatus');
    const f3Badge = document.getElementById('f3Badge');

    function switchTab(mode) {
      if (mode === 'realtime') {
        tabRealtimeBtn.classList.add('active');
        tabSpectrogramBtn.classList.remove('active');
        viewRealtime.classList.add('active');
        viewSpectrogram.classList.remove('active');
        panelRealtime.style.display = 'flex';
        panelSpectrogram.style.display = 'none';
        setTimeout(() => {
          resizeRtCanvas();
        }, 50);
      } else {
        tabRealtimeBtn.classList.remove('active');
        tabSpectrogramBtn.classList.add('active');
        viewRealtime.classList.remove('active');
        viewSpectrogram.classList.add('active');
        panelRealtime.style.display = 'none';
        panelSpectrogram.style.display = 'flex';
        f3Badge.style.display = 'none';
        setTimeout(() => {
          resizeSpecCanvasToFit();
          startSpectrogramLoop();
        }, 50);
      }
    }

    tabRealtimeBtn.addEventListener('click', () => switchTab('realtime'));
    tabSpectrogramBtn.addEventListener('click', () => switchTab('spectrogram'));

    function toggleFullscreen() {
      if (!document.body.classList.contains('is-fullscreen')) {
        document.body.classList.add('is-fullscreen');
      } else {
        document.body.classList.remove('is-fullscreen');
      }
      setTimeout(() => {
        resizeRtCanvas();
        resizeSpecCanvasToFit();
      }, 100);
    }
    document.getElementById('fullscreenBtn1').addEventListener('click', toggleFullscreen);
    document.getElementById('fullscreenBtn2').addEventListener('click', toggleFullscreen);
    document.getElementById('exitFullscreenBtn').addEventListener('click', toggleFullscreen);

    // 1. リアルタイム解析
    const rtCanvas = document.getElementById('rtCanvas');
    const rtCtx = rtCanvas.getContext('2d');
    const startMicBtn = document.getElementById('startMicBtn');
    const freezeBtn = document.getElementById('freezeBtn');
    const resetPeakBtn = document.getElementById('resetPeakBtn');
    const recordOneTapBtn = document.getElementById('recordOneTapBtn');
    const minDbSlider = document.getElementById('minDbSlider');
    const minDbVal = document.getElementById('minDbVal');

    let analyser = null;
    let micStream = null;
    let isMicActive = false;
    let isFrozen = false;
    let minDb = -80;
    const maxDbLimit = 0;

    const peakHoldVolumes = new Float32Array(NUM_KEYS).fill(-200);

    minDbSlider.addEventListener('input', (e) => {
      minDb = parseInt(e.target.value);
      minDbVal.innerText = `${minDb} dB`;
    });

    freezeBtn.addEventListener('click', () => {
      isFrozen = !isFrozen;
      freezeBtn.classList.toggle('active', isFrozen);
      freezeBtn.innerText = isFrozen ? "解除 (RESUME)" : "静止 (FREEZE)";
    });

    resetPeakBtn.addEventListener('click', () => {
      peakHoldVolumes.fill(-200);
    });

    function resizeRtCanvas() {
      const container = viewRealtime;
      if (container.clientWidth > 0 && container.clientHeight > 0) {
        rtCanvas.width = container.clientWidth;
        rtCanvas.height = container.clientHeight;
      }
    }
    window.addEventListener('resize', resizeRtCanvas);
    resizeRtCanvas();

    startMicBtn.addEventListener('click', async () => {
      if (isMicActive) return;
      const ctx = getAudioContext();

      try {
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
        });
      } catch (err) {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      }

      const source = ctx.createMediaStreamSource(micStream);
      analyser = ctx.createAnalyser();
      analyser.fftSize = 8192;
      analyser.smoothingTimeConstant = 0.15;
      source.connect(analyser);

      isMicActive = true;
      startMicBtn.style.display = 'none';
      infoStatus.innerText = "マイク解析中...";
      drawRealtimeLoop();
    });

    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;

    recordOneTapBtn.addEventListener('click', async () => {
      if (!isMicActive) {
        startMicBtn.click();
        await new Promise(r => setTimeout(r, 500));
      }

      if (isRecording) return;
      isRecording = true;
      recordOneTapBtn.classList.add('active');
      recordedChunks = [];

      const mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';
      mediaRecorder = mimeType ? new MediaRecorder(micStream, { mimeType }) : new MediaRecorder(micStream);

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = async () => {
        const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'audio/wav' });
        const mediaUrl = URL.createObjectURL(blob);
        const arrayBuffer = await blob.arrayBuffer();
        const ctx = getAudioContext();
        const audioBuffer = await ctx.decodeAudioData(arrayBuffer);

        switchTab('spectrogram');
        loadAudioBufferToSpectrogram(audioBuffer, "ワンタップ録音データ", mediaUrl);

        isRecording = false;
        recordOneTapBtn.classList.remove('active');
        recordOneTapBtn.innerText = "🔴 ワンタップ録音 (5秒)";
      };

      mediaRecorder.start();
      let timeLeft = 5;
      recordOneTapBtn.innerText = `録音中... (${timeLeft}s)`;

      const timer = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
          recordOneTapBtn.innerText = `録音中... (${timeLeft}s)`;
        } else {
          clearInterval(timer);
          if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            mediaRecorder.stop();
          }
        }
      }, 1000);
    });

    function drawRealtimeLoop() {
      requestAnimationFrame(drawRealtimeLoop);

      if (viewRealtime.classList.contains('active')) {
        if (rtCanvas.width !== viewRealtime.clientWidth || rtCanvas.height !== viewRealtime.clientHeight) {
          resizeRtCanvas();
        }
      }

      if (!analyser || isFrozen) return;

      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Float32Array(bufferLength);
      analyser.getFloatFrequencyData(dataArray);

      const sampleRate = audioCtx.sampleRate;
      const fftSize = analyser.fftSize;

      rtCtx.clearRect(0, 0, rtCanvas.width, rtCanvas.height);

      const paddingLeft = 45;
      const indicatorAreaHeight = 25;
      const regionGuideHeight = 22;
      const keyAreaHeight = Math.max(35, Math.min(60, rtCanvas.height * 0.16));
      const spectrumWidth = rtCanvas.width - paddingLeft;
      const spectrumHeight = rtCanvas.height - keyAreaHeight - indicatorAreaHeight - regionGuideHeight;
      const barWidth = spectrumWidth / NUM_KEYS;
      const dbRange = maxDbLimit - minDb;

      rtCtx.fillStyle = "#666";
      rtCtx.font = "10px sans-serif";
      rtCtx.textAlign = "right";
      rtCtx.textBaseline = "middle";

      for (let db = maxDbLimit; db >= minDb; db -= 20) {
        const y = regionGuideHeight + spectrumHeight - (((db - minDb) / dbRange) * spectrumHeight);
        rtCtx.strokeStyle = "rgba(255, 255, 255, 0.08)";
        rtCtx.beginPath();
        rtCtx.moveTo(paddingLeft, y);
        rtCtx.lineTo(rtCanvas.width, y);
        rtCtx.stroke();
        rtCtx.fillText(`${db}dB`, paddingLeft - 5, y);
      }

      const currentVolumes = new Float32Array(NUM_KEYS);
      let maxVolDb = -200;
      let peakKeyIndex = -1;
      let f3MaxDb = -200;
      let f3PeakKeyIndex = -1;

      for (let i = 0; i < NUM_KEYS; i++) {
        const key = keyLUT[i];
        const idxLow = Math.floor(key.freqLow / (sampleRate / fftSize));
        const idxHigh = Math.ceil(key.freqHigh / (sampleRate / fftSize));

        let maxDb = -200;
        for (let j = idxLow; j <= idxHigh; j++) {
          if (j < bufferLength && dataArray[j] > maxDb) {
            maxDb = dataArray[j];
          }
        }
        currentVolumes[i] = maxDb;

        if (maxDb > peakHoldVolumes[i]) {
          peakHoldVolumes[i] = maxDb;
        } else {
          peakHoldVolumes[i] -= 0.3;
        }

        if (maxDb > maxVolDb && maxDb > minDb) {
          maxVolDb = maxDb;
          peakKeyIndex = i;
        }

        if (key.region === "F3" && maxDb > f3MaxDb) {
          f3MaxDb = maxDb;
          f3PeakKeyIndex = i;
        }
      }

      const hasF3Resonance = (f3MaxDb > minDb + 20 && f3MaxDb > maxVolDb - 25);

      if (viewRealtime.classList.contains('active')) {
        f3Badge.style.display = hasF3Resonance ? 'inline-block' : 'none';
        if (peakKeyIndex !== -1) {
          const pk = keyLUT[peakKeyIndex];
          infoStatus.innerText = `基音(F0): ${pk.noteName}${pk.octave} (${pk.freqCenter} Hz) / ${Math.round(maxVolDb)} dB`;
        } else {
          infoStatus.innerText = "声を待機中...";
        }
      }

      for (let i = 0; i < NUM_KEYS; i++) {
        const key = keyLUT[i];
        const x = paddingLeft + (i * barWidth);

        if (key.region === "F1") {
          rtCtx.fillStyle = "rgba(0, 229, 255, 0.45)";
          rtCtx.fillRect(x, 0, barWidth, regionGuideHeight);
        } else if (key.region === "F2") {
          rtCtx.fillStyle = "rgba(208, 128, 255, 0.45)";
          rtCtx.fillRect(x, 0, barWidth, regionGuideHeight);
        } else if (key.region === "F3") {
          rtCtx.fillStyle = hasF3Resonance ? "rgba(255, 215, 0, 0.75)" : "rgba(255, 215, 0, 0.35)";
          rtCtx.fillRect(x, 0, barWidth, regionGuideHeight);
        }
      }

      rtCtx.font = "bold 10px sans-serif";
      rtCtx.textAlign = "center";
      rtCtx.textBaseline = "middle";

      const f1Key = keyLUT.find(k => k.midi === 66);
      const f2Key = keyLUT.find(k => k.midi === 84);
      const f3Key = keyLUT.find(k => k.midi === 100);

      if (f1Key) {
        rtCtx.fillStyle = "#ffffff";
        rtCtx.fillText("F1(口の開け方)", paddingLeft + (keyLUT.indexOf(f1Key) * barWidth), regionGuideHeight / 2);
      }
      if (f2Key) {
        rtCtx.fillStyle = "#ffffff";
        rtCtx.fillText("F2(舌の位置)", paddingLeft + (keyLUT.indexOf(f2Key) * barWidth), regionGuideHeight / 2);
      }
      if (f3Key) {
        rtCtx.fillStyle = "#000000";
        rtCtx.fillText("★ F3(響き)", paddingLeft + (keyLUT.indexOf(f3Key) * barWidth), regionGuideHeight / 2);
      }

      for (let i = 0; i < NUM_KEYS; i++) {
        const key = keyLUT[i];
        const maxDb = currentVolumes[i];
        const peakDb = peakHoldVolumes[i];

        let normalized = (maxDb - minDb) / dbRange;
        if (normalized < 0) normalized = 0;
        if (normalized > 1) normalized = 1;

        const barHeight = normalized * spectrumHeight;
        const x = paddingLeft + (i * barWidth);
        const y = regionGuideHeight + spectrumHeight - barHeight;

        if (key.region === "F1") {
          rtCtx.fillStyle = "rgba(0, 229, 255, 0.22)";
        } else if (key.region === "F2") {
          rtCtx.fillStyle = "rgba(208, 128, 255, 0.22)";
        } else if (key.region === "F3") {
          rtCtx.fillStyle = "rgba(255, 215, 0, 0.15)";
        } else {
          rtCtx.fillStyle = key.isBlack ? "rgba(10, 10, 10, 0.9)" : "rgba(25, 25, 25, 0.4)";
        }
        rtCtx.fillRect(x, regionGuideHeight, barWidth - 0.5, spectrumHeight);

        if (barHeight > 1) {
          rtCtx.fillStyle = key.region === "F3" ? `hsl(45, 100%, 60%)` : `hsl(${key.hue}, 80%, 55%)`;
          rtCtx.fillRect(x, y, barWidth - 0.5, barHeight);
        }

        if (peakDb > minDb) {
          let pkNorm = (peakDb - minDb) / dbRange;
          if (pkNorm > 1) pkNorm = 1;
          const pkY = regionGuideHeight + spectrumHeight - (pkNorm * spectrumHeight);
          rtCtx.fillStyle = "#ffffff";
          rtCtx.fillRect(x, pkY, barWidth - 0.5, 2);
        }

        const keyY = regionGuideHeight + spectrumHeight;
        if (key.isBlack) {
          rtCtx.fillStyle = "#1a1a1a";
          rtCtx.fillRect(x, keyY, barWidth - 0.5, keyAreaHeight * 0.7);
        } else {
          rtCtx.fillStyle = "#fafafa";
          rtCtx.fillRect(x, keyY, barWidth - 0.5, keyAreaHeight);

          if (key.noteName === "C") {
            rtCtx.fillStyle = "#ff3333";
            rtCtx.font = "bold 9px sans-serif";
            rtCtx.textAlign = "center";
            rtCtx.fillText(`C${key.octave}`, x + barWidth / 2, keyY + keyAreaHeight - 4);
          }
        }

        const centerX = x + barWidth / 2;
        const centerY = rtCanvas.height - indicatorAreaHeight / 2;

        if (i === peakKeyIndex && maxVolDb > minDb) {
          rtCtx.beginPath();
          rtCtx.arc(centerX, centerY, Math.min(barWidth * 1.2, 6), 0, Math.PI * 2);
          rtCtx.fillStyle = "#00aaff";
          rtCtx.fill();
        }

        if (i === f3PeakKeyIndex && hasF3Resonance) {
          rtCtx.fillStyle = "#ffd700";
          rtCtx.font = "bold 12px sans-serif";
          rtCtx.textAlign = "center";
          rtCtx.fillText("★", centerX, centerY + 3);
        }
      }
    }

    // 2. 録音 & 音声ファイル縦スクロールスペクトログラム
    const specCanvas = document.getElementById('specCanvas');
    const specCtx = specCanvas.getContext('2d');
    const specWrapper = document.getElementById('specWrapper');
    const fileInput = document.getElementById('fileInput');
    const audioPlayer = document.getElementById('audioPlayer');
    const playAudioBtn = document.getElementById('playAudioBtn');
    const timeScaleSlider = document.getElementById('timeScaleSlider');
    const timeScaleVal = document.getElementById('timeScaleVal');
    const sensSlider = document.getElementById('sensSlider');
    const sensVal = document.getElementById('sensVal');
    const rateSelect = document.getElementById('rateSelect');

    const PIANO_HEIGHT = 28;

    let specAudioBuffer = null;
    let currentAudioName = "";
    let rawAnalysisData = null;
    let analysisHeight = 0;
    let offscreenCanvas = null;
    let isDragging = false;
    let isLoopRunning = false;
    let currentMediaUrl = null;
    let timeScaleDebounceTimer = null;

    function resizeSpecCanvasToFit() {
      const wrapperWidth = specWrapper.clientWidth;
      if (wrapperWidth && specCanvas.width !== wrapperWidth) {
        specCanvas.width = wrapperWidth;
        updateSpectrogramImage();
      }
    }
    window.addEventListener('resize', resizeSpecCanvasToFit);

    playAudioBtn.addEventListener('click', async () => {
      getAudioContext();
      if (!audioPlayer.src) {
        alert("解析された音声データがありません。");
        return;
      }

      if (audioPlayer.paused) {
        try {
          await audioPlayer.play();
          playAudioBtn.innerText = "一時停止";
          playAudioBtn.classList.add('active');
        } catch(err) {
          console.error("再生エラー:", err);
        }
      } else {
        audioPlayer.pause();
        playAudioBtn.innerText = "再生";
        playAudioBtn.classList.remove('active');
      }
    });

    audioPlayer.addEventListener('ended', () => {
      playAudioBtn.innerText = "再生";
      playAudioBtn.classList.remove('active');
    });

    rateSelect.addEventListener('change', () => {
      audioPlayer.playbackRate = parseFloat(rateSelect.value);
    });

    // 時間軸スライダーイベント（リアルタイム感度・デバウンス付き再描画）
    timeScaleSlider.addEventListener('input', () => {
      const pps = parseInt(timeScaleSlider.value);
      timeScaleVal.innerText = `${pps} px/s`;

      if (specAudioBuffer) {
        clearTimeout(timeScaleDebounceTimer);
        timeScaleDebounceTimer = setTimeout(() => {
          loadAudioBufferToSpectrogram(specAudioBuffer, currentAudioName, currentMediaUrl, false);
        }, 200);
      }
    });

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      infoStatus.innerText = 'ファイル解析中...';
      const mediaUrl = URL.createObjectURL(file);

      const ctx = getAudioContext();
      const arrayBuffer = await file.arrayBuffer();
      const audioBuffer = await ctx.decodeAudioData(arrayBuffer);

      loadAudioBufferToSpectrogram(audioBuffer, file.name, mediaUrl, true);
      fileInput.value = '';
    });

    async function loadAudioBufferToSpectrogram(buffer, name, mediaSrcUrl, isNewSource = true) {
      if (isNewSource) {
        if (audioPlayer) {
          audioPlayer.pause();
          audioPlayer.currentTime = 0;
        }
        if (currentMediaUrl && currentMediaUrl !== mediaSrcUrl) {
          URL.revokeObjectURL(currentMediaUrl);
        }
        playAudioBtn.innerText = "再生";
        playAudioBtn.classList.remove('active');

        if (mediaSrcUrl) {
          currentMediaUrl = mediaSrcUrl;
          audioPlayer.src = mediaSrcUrl;
          audioPlayer.playbackRate = parseFloat(rateSelect.value);
        }
      }

      specAudioBuffer = buffer;
      currentAudioName = name;

      const wrapperW = specWrapper.clientWidth || 1000;
      specCanvas.width = wrapperW;

      const MAX_CANVAS_HEIGHT = 8000; // ブラウザ許容高度上限
      const screenMinPx = specWrapper.clientHeight || 500;
      
      let pps = parseInt(timeScaleSlider.value) || 100;
      if (buffer.duration * pps > MAX_CANVAS_HEIGHT) {
        pps = MAX_CANVAS_HEIGHT / buffer.duration;
      }

      const calculatedHeight = Math.max(screenMinPx, Math.floor(buffer.duration * pps));
      specCanvas.height = calculatedHeight;

      await renderFullSpectrogram(buffer);
      infoStatus.innerText = `解析完了: ${name}`;

      if (isNewSource) {
        specWrapper.scrollTop = specCanvas.height - specWrapper.clientHeight / 2;
      }
      startSpectrogramLoop();
    }

    async function renderFullSpectrogram(buffer) {
      const pcm = buffer.getChannelData(0);
      const sampleRate = buffer.sampleRate;
      const height = specCanvas.height;
      analysisHeight = height;

      rawAnalysisData = new Float32Array(height * NUM_KEYS);

      const keyFreqs = new Float32Array(NUM_KEYS);
      for (let i = 0; i < NUM_KEYS; i++) keyFreqs[i] = midiToFreq(i + MIN_MIDI);

      const windowSize = 2048;
      const halfWin = windowSize / 2;
      const totalSamples = pcm.length;

      const hannWindow = new Float32Array(windowSize);
      for (let n = 0; n < windowSize; n++) {
        hannWindow[n] = 0.5 * (1 - Math.cos((2 * Math.PI * n) / windowSize));
      }

      const keyCoeffs = new Float32Array(NUM_KEYS);
      for (let k = 0; k < NUM_KEYS; k++) {
        const omega = (2 * Math.PI * keyFreqs[k]) / sampleRate;
        keyCoeffs[k] = 2 * Math.cos(omega);
      }

      const frame = new Float32Array(windowSize);

      for (let y = 0; y < height; y++) {
        const centerSample = Math.floor(((height - 1 - y) / height) * totalSamples);
        const startSample = centerSample - halfWin;

        for (let n = 0; n < windowSize; n++) {
          const idx = startSample + n;
          frame[n] = (idx >= 0 && idx < totalSamples) ? pcm[idx] * hannWindow[n] : 0;
        }

        for (let k = 0; k < NUM_KEYS; k++) {
          const coeff = keyCoeffs[k];
          let s1 = 0, s2 = 0;
          for (let n = 0; n < windowSize; n++) {
            const s0 = frame[n] + coeff * s1 - s2;
            s2 = s1; s1 = s0;
          }
          const power = Math.max(0, s1 * s1 + s2 * s2 - coeff * s1 * s2);
          rawAnalysisData[y * NUM_KEYS + k] = Math.sqrt(power) / (windowSize / 4);
        }

        if (y % 150 === 0) {
          infoStatus.innerText = `スペクトログラム計算中... (${Math.round((y / height) * 100)}%)`;
          await new Promise(r => setTimeout(r, 0));
        }
      }

      updateSpectrogramImage();
    }

    function updateSpectrogramImage() {
      if (!rawAnalysisData) return;

      const width = specCanvas.width;
      const height = analysisHeight;
      const keyW = width / NUM_KEYS;
      const sensitivity = parseFloat(sensSlider.value);

      offscreenCanvas = document.createElement('canvas');
      offscreenCanvas.width = width;
      offscreenCanvas.height = height;
      const offCtx = offscreenCanvas.getContext('2d');

      const imgData = offCtx.createImageData(width, height);
      const data = imgData.data;

      for (let i = 3; i < data.length; i += 4) data[i] = 255;

      const keyXBounds = new Array(NUM_KEYS);
      for (let k = 0; k < NUM_KEYS; k++) {
        keyXBounds[k] = { start: Math.floor(k * keyW), end: Math.floor((k + 1) * keyW) };
      }

      for (let y = 0; y < height; y++) {
        const yOffset = y * width;
        const rowDataIdx = y * NUM_KEYS;

        for (let k = 0; k < NUM_KEYS; k++) {
          const mag = rawAnalysisData[rowDataIdx + k];
          const val = Math.min(1, Math.max(0, Math.log10(1 + mag * 25 * sensitivity)));

          if (val > 0.01) {
            let r = 0, g = 0, b = 0;
            if (val < 0.25) {
              b = Math.floor((val / 0.25) * 180);
            } else if (val < 0.55) {
              const t = (val - 0.25) / 0.3;
              g = Math.floor(t * 200); b = 180 + Math.floor(t * 75);
            } else if (val < 0.85) {
              const t = (val - 0.55) / 0.3;
              r = Math.floor(t * 255); g = 200 + Math.floor(t * 55); b = Math.floor((1 - t) * 255);
            } else {
              const t = (val - 0.85) / 0.15;
              r = 255; g = 255; b = Math.floor(t * 255);
            }

            const xStart = keyXBounds[k].start;
            const xEnd = keyXBounds[k].end;

            for (let x = xStart; x < xEnd; x++) {
              const pIdx = (yOffset + x) * 4;
              data[pIdx] = r; data[pIdx + 1] = g; data[pIdx + 2] = b;
            }
          }
        }
      }

      offCtx.putImageData(imgData, 0, 0);
    }

    sensSlider.addEventListener('input', () => {
      sensVal.textContent = `${parseFloat(sensSlider.value).toFixed(1)}x`;
      updateSpectrogramImage();
    });

    function startSpectrogramLoop() {
      if (!isLoopRunning) {
        isLoopRunning = true;
        redrawSpectrogramLoop();
      }
    }

    function redrawSpectrogramLoop() {
      if (!viewSpectrogram.classList.contains('active')) {
        isLoopRunning = false;
        return;
      }

      let playheadY = specCanvas.height;

      if (audioPlayer.duration && !isNaN(audioPlayer.duration)) {
        const progress = audioPlayer.currentTime / audioPlayer.duration;
        playheadY = (1 - progress) * specCanvas.height;

        if (!audioPlayer.paused && !isDragging) {
          specWrapper.scrollTop = playheadY - specWrapper.clientHeight / 2;
        }
      }

      specCtx.clearRect(0, 0, specCanvas.width, specCanvas.height);
      if (offscreenCanvas) {
        specCtx.drawImage(offscreenCanvas, 0, 0);
      }

      if (specAudioBuffer) {
        drawMovingPianoAndPlayhead(specCtx, playheadY);
      }

      requestAnimationFrame(redrawSpectrogramLoop);
    }

    function drawMovingPianoAndPlayhead(ctx, playheadY) {
      const w = ctx.canvas.width;
      const keyW = w / NUM_KEYS;
      const startY = playheadY;

      // 1. F1, F2, F3 領域の背景網掛け描画（縦軸全体）
      for (let i = 0; i < NUM_KEYS; i++) {
        const key = keyLUT[i];
        const x = i * keyW;

        if (key.region === "F1") {
          ctx.fillStyle = 'rgba(0, 229, 255, 0.25)';
          ctx.fillRect(x, 0, keyW, ctx.canvas.height);
        } else if (key.region === "F2") {
          ctx.fillStyle = 'rgba(208, 128, 255, 0.25)';
          ctx.fillRect(x, 0, keyW, ctx.canvas.height);
        } else if (key.region === "F3") {
          ctx.fillStyle = 'rgba(255, 215, 0, 0.18)';
          ctx.fillRect(x, 0, keyW, ctx.canvas.height);
        }
      }

      // 2. 移動ピアノ鍵盤本体の描画
      for (let i = 0; i < NUM_KEYS; i++) {
        const key = keyLUT[i];
        const x = i * keyW;

        ctx.fillStyle = key.isBlack ? 'rgba(20, 20, 20, 0.95)' : 'rgba(240, 240, 240, 0.95)';
        ctx.fillRect(x, startY, keyW, PIANO_HEIGHT);
        ctx.strokeStyle = 'rgba(80, 80, 80, 0.6)';
        ctx.lineWidth = 0.5;
        ctx.strokeRect(x, startY, keyW, PIANO_HEIGHT);

        if (key.noteName === "C") {
          ctx.fillStyle = '#ff3333';
          ctx.font = 'bold 9px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(`C${key.octave}`, x + keyW / 2, startY + 12);
        }
      }

      // 再生赤ライン
      ctx.strokeStyle = '#ff2222';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, playheadY);
      ctx.lineTo(w, playheadY);
      ctx.stroke();

      // 3. 表示画面の最上部（スクロール固定位置）に帯域ヘッダーガイドを描画
      const guideY = specWrapper.scrollTop;
      const guideH = 22;

      for (let i = 0; i < NUM_KEYS; i++) {
        const key = keyLUT[i];
        const x = i * keyW;

        if (key.region === "F1") {
          ctx.fillStyle = "rgba(0, 229, 255, 0.85)";
          ctx.fillRect(x, guideY, keyW, guideH);
        } else if (key.region === "F2") {
          ctx.fillStyle = "rgba(208, 128, 255, 0.85)";
          ctx.fillRect(x, guideY, keyW, guideH);
        } else if (key.region === "F3") {
          ctx.fillStyle = "rgba(255, 215, 0, 0.85)";
          ctx.fillRect(x, guideY, keyW, guideH);
        }
      }

      ctx.font = "bold 10px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      const f1Key = keyLUT.find(k => k.midi === 66);
      const f2Key = keyLUT.find(k => k.midi === 84);
      const f3Key = keyLUT.find(k => k.midi === 100);

      if (f1Key) {
        ctx.fillStyle = "#ffffff";
        ctx.fillText("F1(口の開け方)", (keyLUT.indexOf(f1Key) * keyW), guideY + guideH / 2);
      }
      if (f2Key) {
        ctx.fillStyle = "#ffffff";
        ctx.fillText("F2(舌の位置)", (keyLUT.indexOf(f2Key) * keyW), guideY + guideH / 2);
      }
      if (f3Key) {
        ctx.fillStyle = "#000000";
        ctx.fillText("★ F3(響き)", (keyLUT.indexOf(f3Key) * keyW), guideY + guideH / 2);
      }
    }

    function seekToPosition(clientY) {
      if (!audioPlayer.duration || !specAudioBuffer) return;
      const rect = specCanvas.getBoundingClientRect();
      const clickY = clientY - rect.top;
      const clampedY = Math.max(0, Math.min(clickY, specCanvas.height));
      const targetTime = (1 - (clampedY / specCanvas.height)) * audioPlayer.duration;
      audioPlayer.currentTime = targetTime;
    }

    specCanvas.addEventListener('pointerdown', (e) => {
      getAudioContext();
      isDragging = true;
      try { specCanvas.setPointerCapture(e.pointerId); } catch(err) {}
      seekToPosition(e.clientY);
    });

    specCanvas.addEventListener('pointermove', (e) => {
      if (isDragging) seekToPosition(e.clientY);
    });

    const stopDrag = () => { isDragging = false; };
    specCanvas.addEventListener('pointerup', stopDrag);
    specCanvas.addEventListener('pointercancel', stopDrag);
  </script>
</body>
