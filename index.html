<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>アコースティック解析用・ピアノ音階アナライザー (C10拡張・スリム鍵盤版)</title>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #080808;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      touch-action: manipulation;
    }

    #topBar {
      background: #121212;
      border-bottom: 1px solid #222;
      padding: 6px 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 10;
    }

    #controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    #info {
      font-size: 15px;
      font-weight: bold;
      color: #00e5ff;
      text-shadow: 0 0 8px rgba(0,229,255,0.4);
      white-space: nowrap;
    }

    button {
      padding: 6px 14px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      background: #0077bb;
      color: white;
      border: none;
      border-radius: 4px;
      transition: 0.1s;
    }
    button:active { background: #0099dd; }

    #fullscreenBtn {
      background: #333;
      border: 1px solid #555;
    }

    .slider-group {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #aaa;
    }
    input[type=range] { vertical-align: middle; cursor: pointer; }

    #canvasContainer {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>

  <div id="topBar">
    <div id="controls">
      <button id="startBtn">解析を開始する</button>
      <button id="fullscreenBtn">全画面表示</button>
      <div class="slider-group">
        <label for="minDbSlider">感度:</label>
        <input type="range" id="minDbSlider" min="-100" max="-40" value="-80" step="5">
        <span id="minDbValue">-80 dB</span>
      </div>
    </div>
    <div id="info">マイク待機中...</div>
  </div>
  
  <div id="canvasContainer">
    <canvas id="canvas"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvasContainer');
    const startBtn = document.getElementById('startBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const infoDiv = document.getElementById('info');
    const minDbSlider = document.getElementById('minDbSlider');
    const minDbValueSpan = document.getElementById('minDbValue');

    const minMidi = 21;
    const maxMidi = 132;
    const numKeys = maxMidi - minMidi + 1; // 112鍵

    const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
    const isBlackKeyList = [false, true, false, true, false, false, true, false, true, false, true, false];

    let keyLUT = [];

    function midiToFreq(midi) {
      return 440 * Math.pow(2, (midi - 69) / 12);
    }

    let minDb = -80;
    const maxDbLimit = 0;

    minDbSlider.addEventListener('input', (e) => {
      minDb = parseInt(e.target.value);
      minDbValueSpan.innerText = `${minDb} dB`;
    });

    function resizeCanvas() {
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          alert(`全画面表示に失敗しました: ${err.message}`);
        });
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    });

    document.addEventListener('fullscreenchange', () => {
      fullscreenBtn.innerText = document.fullscreenElement ? "全画面解除" : "全画面表示";
      resizeCanvas();
    });

    startBtn.addEventListener('click', async () => {
      startBtn.style.display = 'none';
      infoDiv.innerText = "解析中...";

      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      
      const constraints = {
        audio: {
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false,
        }
      };

      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia(constraints);
      } catch (err) {
        infoDiv.innerText = "マイクへのアクセスが拒否されました。";
        return;
      }
      
      const source = audioCtx.createMediaStreamSource(stream);
      const analyser = audioCtx.createAnalyser();
      
      analyser.fftSize = 8192;
      analyser.smoothingTimeConstant = 0.1;
      
      source.connect(analyser);

      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Float32Array(bufferLength);
      const sampleRate = audioCtx.sampleRate;

      keyLUT = [];
      for (let i = 0; i < numKeys; i++) {
        const midi = minMidi + i;
        const noteIndex = midi % 12;
        const freqLow = midiToFreq(midi - 0.5);
        const freqHigh = midiToFreq(midi + 0.5);
        
        keyLUT.push({
          midi: midi,
          noteName: noteNames[noteIndex],
          octave: Math.floor(midi / 12) - 1,
          isBlack: isBlackKeyList[noteIndex],
          freqCenter: Math.round(midiToFreq(midi)),
          indexLow: Math.floor(freqLow / (sampleRate / analyser.fftSize)),
          indexHigh: Math.ceil(freqHigh / (sampleRate / analyser.fftSize)),
          hue: (i / numKeys) * 320,
          isAboveC8: midi > 108
        });
      }

      const noteVolumes = new Float32Array(numKeys);

      function draw() {
        requestAnimationFrame(draw);
        analyser.getFloatFrequencyData(dataArray);

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const paddingLeft = 50;
        const indicatorAreaHeight = 20;

        // ★ 鍵盤の高さを従来の「15%(最大70px)」から「6%(最大30px、最小18px)」へ大幅スリム化
        const keyAreaHeight = Math.max(18, Math.min(30, canvas.height * 0.06));
        
        const spectrumWidth = canvas.width - paddingLeft;
        const spectrumHeight = canvas.height - keyAreaHeight - indicatorAreaHeight;
        const barWidth = spectrumWidth / numKeys;
        const dbRange = maxDbLimit - minDb;

        // 1. 縦軸(dB)描画
        ctx.fillStyle = "#666";
        ctx.font = "11px 'Consolas', monospace";
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";

        const dbStep = (dbRange > 60) ? 20 : 10;
        for (let db = maxDbLimit; db >= minDb; db -= dbStep) {
          const y = spectrumHeight - (((db - minDb) / dbRange) * spectrumHeight);
          if (y < 0) continue;

          ctx.strokeStyle = (db === maxDbLimit) ? "rgba(255, 255, 255, 0.4)" : "rgba(255, 255, 255, 0.08)";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(paddingLeft, y);
          ctx.lineTo(canvas.width, y);
          ctx.stroke();

          ctx.fillText(`${db.toString().padStart(4, ' ')} dB`, paddingLeft - 8, y);
        }

        // 2. 音声解析
        let maxVolumeDb = -200;
        let peakKeyIndex = -1;

        for (let i = 0; i < numKeys; i++) {
          const key = keyLUT[i];

          let maxDb = -200;
          for (let j = key.indexLow; j <= key.indexHigh; j++) {
            if (j < bufferLength && dataArray[j] > maxDb) {
              maxDb = dataArray[j];
            }
          }
          noteVolumes[i] = maxDb;

          if (maxDb > maxVolumeDb && maxDb > -100) {
            maxVolumeDb = maxDb;
            peakKeyIndex = i;
          }
        }

        if (peakKeyIndex !== -1 && maxVolumeDb > minDb) {
          const pk = keyLUT[peakKeyIndex];
          infoDiv.innerText = `基音: ${pk.noteName}${pk.octave} (${pk.freqCenter} Hz) / ${Math.round(maxVolumeDb)} dB`;
        } else {
          infoDiv.innerText = "音声を待機中...";
        }

        // 3. 描画処理（スリムキーボード設計）
        for (let i = 0; i < numKeys; i++) {
          const key = keyLUT[i];
          const maxDb = noteVolumes[i];

          let normalized = (maxDb - minDb) / dbRange;
          if (normalized < 0) normalized = 0;
          if (normalized > 1) normalized = 1;

          const barHeight = normalized * spectrumHeight;
          const x = paddingLeft + (i * barWidth);
          const y = spectrumHeight - barHeight;

          // 背景
          if (key.isAboveC8) {
            ctx.fillStyle = key.isBlack ? "rgba(4, 4, 4, 0.95)" : "rgba(12, 12, 12, 0.5)";
          } else {
            ctx.fillStyle = key.isBlack ? "rgba(10, 10, 10, 0.9)" : "rgba(25, 25, 25, 0.4)";
          }
          ctx.fillRect(x, 0, barWidth - 1, spectrumHeight);

          // スペクトラムバー
          if (barHeight > 1) {
            if (key.isAboveC8) {
              ctx.fillStyle = key.isBlack ? `hsl(${key.hue}, 30%, 20%)` : `hsl(${key.hue}, 35%, 30%)`;
            } else {
              ctx.fillStyle = key.isBlack ? `hsl(${key.hue}, 60%, 40%)` : `hsl(${key.hue}, 80%, 55%)`;
            }
            ctx.fillRect(x + 1, y, barWidth - 2, barHeight);
          }

          // 鍵盤描画（スリム化調整）
          const keyY = spectrumHeight;
          ctx.textAlign = "left";
          ctx.textBaseline = "alphabetic";

          if (key.isBlack) {
            ctx.fillStyle = key.isAboveC8 ? "#0e0e0e" : "#1a1a1a";
            ctx.fillRect(x, keyY, barWidth - 1, keyAreaHeight * 0.65);
            ctx.strokeStyle = key.isAboveC8 ? "#222" : "#333";
            ctx.strokeRect(x, keyY, barWidth - 1, keyAreaHeight * 0.65);
          } else {
            ctx.fillStyle = key.isAboveC8 ? "#666666" : "#fafafa";
            ctx.fillRect(x, keyY, barWidth - 1, keyAreaHeight);
            ctx.strokeStyle = key.isAboveC8 ? "#444" : "#bbb";
            ctx.strokeRect(x, keyY, barWidth - 1, keyAreaHeight);

            // スリム化に伴うC音ラベル描画
            if (key.noteName === "C") {
              ctx.fillStyle = "#ff3333";
              ctx.font = "bold 9px sans-serif";
              ctx.fillText(`C${key.octave}`, x, keyY + keyAreaHeight - 3);
            }
          }

          // C音ガイド線（赤線）
          if (key.noteName === "C") {
            ctx.fillStyle = key.isAboveC8 ? "rgba(255, 0, 0, 0.08)" : "rgba(255, 0, 0, 0.15)";
            ctx.fillRect(x, 0, 1, spectrumHeight);
          }

          // 基音マーカー（青●）
          if (i === peakKeyIndex && maxVolumeDb > minDb) {
            const centerX = x + barWidth / 2;
            const centerY = canvas.height - indicatorAreaHeight / 2;
            const radius = Math.min(barWidth * 1.2, 6);

            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.fillStyle = "#00aaff";
            ctx.fill();
          }
        }

        // C8境界線（青破線）
        const c8Index = 108 - minMidi;
        const boundaryX = paddingLeft + ((c8Index + 1) * barWidth);
        ctx.strokeStyle = "rgba(0, 229, 255, 0.5)";
        ctx.setLineDash([3, 3]);
        ctx.beginPath();
        ctx.moveTo(boundaryX, 0);
        ctx.lineTo(boundaryX, canvas.height);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      draw();
    });
  </script>
</body>
</html>
